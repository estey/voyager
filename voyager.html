<!DOCTYPE html>
<html>
<head>
    <title>Voyager</title>
    <style>
        /* Basic styles for the navbar */
        .navbar {
            background-color: #333;
            overflow: hidden;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .nav-links {
            display: flex;
            justify-content: center;
            flex-grow: 1;
        }
        .navbar a {
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .navbar input[type="text"] {
            padding: 6px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
        }
        .navbar button {
            padding: 6px 10px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .navbar button.search {
            background-color: #4CAF50;
            color: white;
        }
        .navbar button.reset {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-logo">
            <img>
        </div>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact Us</a>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Enter a destination or keyword">
            <button class="search">Search</button>
            <button class="reset">Clear</button>
        </div>
    </div>
    <!-- Content goes here -->
</body>
</html>
